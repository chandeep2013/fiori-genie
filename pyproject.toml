[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiori-genie"
version = "0.1.0"
description = "Generate runnable SAP CAP + Fiori elements projects from functional specifications"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.7",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
genai-hub = ["generative-ai-hub-sdk>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
fiori-genie = "fiori_genie.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fiori_genie = ["render/templates/*.j2", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
